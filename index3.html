<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời khoá biểu</title>
  <style>
    .schedule {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: pink;
      text-align: center;
    }

    .cell {
      background: white;
      padding: 10px;
      border: 1px solid pink;
    }

    .header {
      background: #f8bbd0;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h3>Câu 3: Tạo bảng thời khoá biểu dùng Grid</h3>

  <div class="schedule">
    <div class="cell header">Thứ</div>
    <div class="cell header">Môn</div>
    <div class="cell header">Giờ</div>
    <div class="cell header">Phòng</div>

    <div class="cell">Thứ Hai</div>
    <div class="cell">Toán</div>
    <div class="cell">7:00–8:15</div>
    <div class="cell">N5.1</div>

    <div class="cell">Thứ Ba</div>
    <div class="cell">Tiếng Anh</div>
    <div class="cell">10:15–11:25</div>
    <div class="cell">V3.10</div>

    <div class="cell">Thứ Tư</div>
    <div class="cell">HT & CN Web</div>
    <div class="cell">13:20–17:40</div>
    <div class="cell">H8.02</div>
  </div>

</body>
</html>
