<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Đăng ký</title>
  <style>
    form {
      width: 300px;
      margin: auto;
      border: 2px solid #ccc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      margin-bottom: 5px;
    }

    input, button {
      padding: 5px;
      border-radius: 5px;
    }

    .gender {
      display: flex;
      gap: 10px;
      align-items: center;
    }
  </style>
</head>
<body>

  <h4 style="text-align:center;">Câu 4: Form đăng ký</h4>

  <form>
    <label>Họ tên:</label>
    <input type="text">

    <label>Ngày sinh:</label>
    <input type="date">

    <label>Giới tính:</label>
    <div class="gender">
      <input type="radio" name="gender" value="Nam"> Nam
      <input type="radio" name="gender" value="Nữ"> Nữ
    </div>

    <label>Email:</label>
    <input type="email">

    <button>Gửi</button>
  </form>

</body>
</html>
